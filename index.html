<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>⭐ Star Catcher 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff4f9a;
    --yellow:#ffd93d;
    --orange:#ff9f1c;
    --blue:#38b6ff;
    --purple:#7b3ff2;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{
    width:100%; height:100%; overflow:hidden;
    font-family:'Fredoka','Baloo 2','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    background:#8fe0ff;
    user-select:none; -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    color:#2b3a55;
  }
  #game{ position:fixed; inset:0; display:block; width:100%; height:100%; }

  /* ---------- HUD ---------- */
  #ui{
    position:fixed; inset:0; pointer-events:none;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:12px;
  }
  .hud-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }

  .panel{
    background:rgba(255,255,255,.88);
    border-radius:22px;
    padding:10px 16px;
    border:3px solid #ffffff;
    box-shadow:0 6px 0 rgba(43,58,85,.15), 0 10px 24px rgba(43,58,85,.18);
    backdrop-filter: blur(4px);
  }

  .level-chip{
    font-size:19px; font-weight:700; letter-spacing:1.5px;
    color:#fff;
    background:linear-gradient(180deg,#8b5cf6,#6d28d9);
    padding:3px 14px; border-radius:999px;
    display:inline-block;
    box-shadow:0 3px 0 #4c1d95;
  }
  .bar{
    width:168px; height:15px; margin-top:8px;
    background:#e2e9f5; border-radius:999px; overflow:hidden;
    box-shadow: inset 0 2px 5px rgba(43,58,85,.22);
  }
  .bar-fill{
    height:100%; width:0%;
    border-radius:999px;
    background:linear-gradient(90deg,#ffd93d,#ff9f1c);
    transition: width .22s ease;
    box-shadow:0 0 10px rgba(255,180,0,.8);
  }
  .bar-text{ font-size:15px; font-weight:600; color:#5a6b85; margin-top:5px; }

  .score-panel{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .score{
    font-size:30px; font-weight:700; color:#ff8a00;
    text-shadow:0 2px 0 #fff, 0 3px 0 rgba(0,0,0,.12);
    line-height:1;
  }
  .lives{ font-size:22px; letter-spacing:2px; line-height:1; filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)); }

  /* ---------- Center banner ---------- */
  #banner{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    pointer-events:none; opacity:0;
    transition:opacity .2s ease;
    text-align:center; padding:0 16px;
  }
  #banner.show{ opacity:1; }
  #banner.show .banner-inner{ animation: popIn .5s cubic-bezier(.2,1.7,.4,1) both; }
  .banner-inner{ transform-origin:center; }
  .banner-title{
    font-size:clamp(36px,9vw,84px);
    font-weight:700; letter-spacing:2px; color:#fff;
    text-shadow:
      -4px -4px 0 var(--pink), 4px -4px 0 var(--pink),
      -4px  4px 0 var(--pink), 4px  4px 0 var(--pink),
      0 14px 26px rgba(0,0,0,.28);
  }
  .banner-sub{
    font-size:clamp(17px,3.4vw,26px);
    font-weight:600; color:#fff; margin-top:8px;
    text-shadow:0 3px 0 rgba(0,0,0,.22);
  }

  /* ---------- Overlay (start / game over) ---------- */
  #overlay{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:rgba(20,45,90,.32);
    backdrop-filter: blur(7px);
    -webkit-backdrop-filter: blur(7px);
    opacity:0; pointer-events:none;
    transition:opacity .3s ease;
    padding:16px;
  }
  #overlay.show{ opacity:1; pointer-events:auto; }

  .card{
    background:linear-gradient(180deg,#ffffff,#e9f6ff);
    border-radius:34px;
    padding:30px 34px 34px;
    text-align:center;
    border:6px solid #fff;
    box-shadow:0 14px 0 rgba(43,58,85,.16), 0 26px 60px rgba(20,45,90,.35);
    max-width:min(92vw, 520px);
    animation: popIn .45s cubic-bezier(.2,1.7,.4,1) both;
  }
  @keyframes popIn{
    0%{ transform:scale(.4) rotate(-6deg); opacity:0; }
    60%{ transform:scale(1.08) rotate(2deg); opacity:1; }
    100%{ transform:scale(1) rotate(0deg); opacity:1; }
  }
  .card h1{
    font-size:clamp(28px,6.5vw,46px);
    font-weight:700; letter-spacing:1px; line-height:1.05;
    color:#fff;
    text-shadow:
      -3px -3px 0 var(--pink), 3px -3px 0 var(--pink),
      -3px  3px 0 var(--pink), 3px  3px 0 var(--pink),
      0 10px 18px rgba(0,0,0,.2);
  }
  .card p{ font-size:clamp(15px,3.2vw,20px); font-weight:500; color:#5a6b85; margin-top:12px; line-height:1.45; }
  .card p.warn{ color:#c026d3; font-weight:600; }

  .hints{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top:16px;
  }
  .hint{
    background:#eaf3ff; border:2px solid #cfe4ff;
    border-radius:14px; padding:7px 14px;
    font-size:clamp(13px,2.7vw,16px); font-weight:600; color:#3b6ea5;
  }
  .final-score{
    font-size:clamp(46px,11vw,72px); font-weight:700; color:#ff8a00;
    line-height:1; margin-top:6px;
    text-shadow:0 4px 0 #fff, 0 8px 0 rgba(0,0,0,.12);
  }

  button{
    font-family:inherit;
    font-size:clamp(21px,4.6vw,27px);
    font-weight:700; letter-spacing:1.5px;
    color:#7a3d00;
    background:linear-gradient(180deg,#ffe066,#ffa41b);
    border:4px solid #fff;
    border-radius:999px;
    padding:13px 48px;
    margin-top:22px;
    cursor:pointer;
    box-shadow:0 8px 0 #d97706, 0 14px 26px rgba(217,119,6,.4);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  button:hover{ filter:brightness(1.05); }
  button:active{ transform:translateY(6px); box-shadow:0 2px 0 #d97706, 0 6px 12px rgba(217,119,6,.4); }

  /* flash on damage */
  #flash{
    position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(circle at 50% 60%, rgba(255,0,60,.55), rgba(255,0,60,.15) 70%);
    opacity:0; transition:opacity .35s ease;
  }
  #flash.on{ opacity:1; transition:opacity .06s ease; }

  @media (max-width:520px){
    .bar{ width:120px; }
    .score{ font-size:24px; }
    .level-chip{ font-size:16px; }
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="flash"></div>

  <div id="ui">
    <div class="hud-top">
      <div class="panel">
        <div class="level-chip" id="levelChip">LEVEL 1</div>
        <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        <div class="bar-text" id="barText">0 / 6 ⭐</div>
      </div>
      <div class="panel score-panel">
        <div class="score" id="scoreEl">0</div>
        <div class="lives" id="livesEl">❤️❤️❤️</div>
      </div>
    </div>
  </div>

  <div id="banner"><div class="banner-inner"><div class="banner-title"></div><div class="banner-sub"></div></div></div>

  <div id="overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();

/* --- Sky gradient background --- */
(function makeSky(){
  const c = document.createElement('canvas');
  c.width = 4; c.height = 256;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0.00, '#1f9dff');
  g.addColorStop(0.35, '#63c8ff');
  g.addColorStop(0.70, '#a8e4ff');
  g.addColorStop(1.00, '#e2f8ff');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,4,256);
  const tex = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;
  scene.background = tex;
})();

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 300);
let camBaseY = 6.5, camBaseZ = 12;

/* ============================================================
   LIGHTS
   ============================================================ */
scene.add(new THREE.HemisphereLight(0xffffff, 0x8fd98f, 0.95));
scene.add(new THREE.AmbientLight(0xffffff, 0.30));

const sun = new THREE.DirectionalLight(0xfff6e0, 1.15);
sun.position.set(9, 19, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 55;
sun.shadow.bias = -0.0009;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, 0);

/* ============================================================
   WORLD DECORATION
   ============================================================ */
// --- Grass ground with procedural texture ---
(function ground(){
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#6fdc6f';
  ctx.fillRect(0,0,256,256);
  for (let i=0;i<160;i++){
    ctx.fillStyle = Math.random() > 0.5 ? '#7ee87e' : '#61cf61';
    ctx.beginPath();
    ctx.arc(Math.random()*256, Math.random()*256, 6 + Math.random()*22, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(14,14);
  if (THREE.sRGBEncoding) tex.encoding = THREE.sRGBEncoding;

  const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(160,160), mat);
  mesh.rotation.x = -Math.PI/2;
  mesh.receiveShadow = true;
  scene.add(mesh);
})();

// --- Trees ---
const trunkMat = new THREE.MeshStandardMaterial({ color:0x9a6236, roughness:0.95 });
const leafMats = [
  new THREE.MeshStandardMaterial({ color:0x3ec46d, roughness:0.95, flatShading:true }),
  new THREE.MeshStandardMaterial({ color:0x2fb35e, roughness:0.95, flatShading:true }),
  new THREE.MeshStandardMaterial({ color:0x59d67f, roughness:0.95, flatShading:true })
];
function makeTree(x, z, s){
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18*s, 0.26*s, 1.0*s, 8), trunkMat);
  trunk.position.y = 0.5*s;
  trunk.castShadow = true;
  g.add(trunk);
  const mat = leafMats[Math.floor(Math.random()*leafMats.length)];
  for (let i=0;i<3;i++){
    const cone = new THREE.Mesh(new THREE.ConeGeometry((1.15 - i*0.26)*s, 1.35*s, 9), mat);
    cone.position.y = (1.05 + i*0.72)*s;
    cone.castShadow = true;
    cone.receiveShadow = true;
    g.add(cone);
  }
  g.position.set(x, 0, z);
  g.rotation.y = Math.random()*Math.PI*2;
  return g;
}
for (let i=0;i<26;i++){
  let x, z, tries = 0;
  do {
    x = (Math.random()*2 - 1) * 26;
    z = -Math.random()*34 + 7;
    tries++;
  } while (Math.abs(x) < 8.5 && z < 6 && tries < 30);
  scene.add(makeTree(x, z, 0.8 + Math.random()*0.85));
}

// --- Bushes & flowers ---
const bushMat = new THREE.MeshStandardMaterial({ color:0x48c977, roughness:1, flatShading:true });
const flowerColors = [0xff6fae, 0xffd93d, 0xff8a5c, 0x9b8cff, 0xff5a5a];
for (let i=0;i<34;i++){
  const x = (Math.random()*2 - 1) * 22;
  const z = -Math.random()*30 + 6;
  if (Math.abs(x) < 7 && z < 6) continue;

  if (Math.random() < 0.5){
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.45 + Math.random()*0.4, 10, 8), bushMat);
    b.position.set(x, 0.3, z);
    b.scale.y = 0.75;
    b.castShadow = true;
    scene.add(b);
  } else {
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,0.55,5),
      new THREE.MeshStandardMaterial({color:0x3aa85a, roughness:1}));
    stem.position.set(x, 0.28, z);
    scene.add(stem);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8),
      new THREE.MeshStandardMaterial({ color: flowerColors[i % flowerColors.length], roughness:0.7 }));
    head.position.set(x, 0.6, z);
    scene.add(head);
  }
}

// --- Clouds ---
const clouds = [];
const cloudMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, metalness:0 });
function makeCloud(){
  const g = new THREE.Group();
  const n = 3 + Math.floor(Math.random()*3);
  for (let i=0;i<n;i++){
    const s = 1.0 + Math.random()*1.1;
    const m = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 10), cloudMat);
    m.position.set((i - n/2)*1.5, Math.random()*0.5, (Math.random()-0.5)*1.2);
    m.scale.y = 0.72;
    g.add(m);
  }
  return g;
}
for (let i=0;i<12;i++){
  const c = makeCloud();
  c.position.set((Math.random()*2-1)*45, 14 + Math.random()*12, -8 - Math.random()*40);
  c.scale.setScalar(0.9 + Math.random()*1.1);
  scene.add(c);
  clouds.push({ mesh:c, speed: 0.25 + Math.random()*0.5 });
}

/* ============================================================
   PLAYER
   ============================================================ */
const player = new THREE.Group();
player.position.set(0, 0.86, 0);
scene.add(player);

const playerBody = new THREE.Group();
player.add(playerBody);

(function buildPlayer(){
  const bodyMat = new THREE.MeshStandardMaterial({ color:0xff5ea8, roughness:0.32, metalness:0.05 });
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 24), bodyMat);
  body.scale.set(1, 0.95, 1);
  body.castShadow = true;
  playerBody.add(body);

  const earMat = new THREE.MeshStandardMaterial({ color:0xff83bf, roughness:0.4 });
  [-1, 1].forEach(function(s){
    const ear = new THREE.Mesh(new THREE.SphereGeometry(0.27, 16, 12), earMat);
    ear.position.set(0.44*s, 0.76, 0);
    ear.scale.set(1, 1.2, 0.72);
    ear.castShadow = true;
    playerBody.add(ear);
  });

  const eyeWhite = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.18 });
  const pupilMat = new THREE.MeshBasicMaterial({ color:0x232336 });
  [-1, 1].forEach(function(s){
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.23, 18, 14), eyeWhite);
    eye.position.set(0.29*s, 0.16, 0.58);
    eye.scale.z = 0.65;
    playerBody.add(eye);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.115, 14, 10), pupilMat);
    pupil.position.set(0.30*s, 0.14, 0.74);
    playerBody.add(pupil);
  });

  // little mouth
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.13, 14, 12),
    new THREE.MeshBasicMaterial({ color:0x3a2440 }));
  mouth.position.set(0, -0.24, 0.72);
  mouth.scale.set(1, 0.7, 0.5);
  playerBody.add(mouth);

  // cheeks
  const cheekMat = new THREE.MeshBasicMaterial({ color:0xff9ecb, transparent:true, opacity:0.85 });
  [-1, 1].forEach(function(s){
    const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), cheekMat);
    cheek.position.set(0.52*s, -0.10, 0.60);
    cheek.scale.set(1, 0.7, 0.35);
    playerBody.add(cheek);
  });
})();

/* ============================================================
   FALLING OBJECT GEOMETRIES
   ============================================================ */
function makeStarGeometry(outer, inner, points){
  const shape = new THREE.Shape();
  const step = Math.PI / points;
  for (let i = 0; i < points*2; i++){
    const r = (i % 2 === 0) ? outer : inner;
    const a = i * step - Math.PI/2;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    if (i === 0) shape.moveTo(x, y); else shape.lineTo(x, y);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.3, bevelEnabled: true, bevelThickness: 0.07,
    bevelSize: 0.07, bevelSegments: 2, curveSegments: 2
  });
  geo.center();
  geo.computeVertexNormals();
  return geo;
}

function makeHeartGeometry(){
  const s = new THREE.Shape();
  s.moveTo(0, 0.35);
  s.bezierCurveTo(0, 0.35, -0.15, 0.85, -0.5, 0.85);
  s.bezierCurveTo(-0.95, 0.85, -0.95, 0.25, -0.95, 0.25);
  s.bezierCurveTo(-0.95, -0.15, -0.5, -0.6, 0, -1.0);
  s.bezierCurveTo(0.5, -0.6, 0.95, -0.15, 0.95, 0.25);
  s.bezierCurveTo(0.95, 0.25, 0.95, 0.85, 0.5, 0.85);
  s.bezierCurveTo(0.15, 0.85, 0, 0.35, 0, 0.35);
  const geo = new THREE.ExtrudeGeometry(s, {
    depth: 0.34, bevelEnabled: true, bevelThickness: 0.07,
    bevelSize: 0.07, bevelSegments: 2, curveSegments: 8
  });
  geo.center();
  geo.scale(0.62, 0.62, 0.62);
  geo.computeVertexNormals();
  return geo;
}

const starGeo  = makeStarGeometry(0.52, 0.22, 5);
const heartGeo = makeHeartGeometry();
const bombGeo  = new THREE.IcosahedronGeometry(0.46, 0);

const starMat = new THREE.MeshStandardMaterial({
  color: 0xffd93d, emissive: 0xff9d00, emissiveIntensity: 0.55,
  metalness: 0.4, roughness: 0.24
});
const heartMat = new THREE.MeshStandardMaterial({
  color: 0xff4d6d, emissive: 0xb30028, emissiveIntensity: 0.4,
  metalness: 0.2, roughness: 0.3
});
const bombMat = new THREE.MeshStandardMaterial({
  color: 0x3b2b4f, emissive: 0xff2d55, emissiveIntensity: 0.55,
  flatShading: true, roughness: 0.55, metalness: 0.25
});

/* ============================================================
   PARTICLES
   ============================================================ */
const particleGeo = new THREE.SphereGeometry(0.11, 7, 6);
const particleMats = {
  gold:  new THREE.MeshBasicMaterial({ color: 0xffd93d }),
  white: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  pink:  new THREE.MeshBasicMaterial({ color: 0xff6fb0 }),
  red:   new THREE.MeshBasicMaterial({ color: 0xff4466 }),
  cyan:  new THREE.MeshBasicMaterial({ color: 0x6fe7ff })
};
const particles = [];

function spawnBurst(pos, matKeys, count, speed){
  for (let i=0;i<count;i++){
    const mat = particleMats[matKeys[i % matKeys.length]];
    const m = new THREE.Mesh(particleGeo, mat);
    m.position.copy(pos);
    const dir = new THREE.Vector3(
      Math.random()*2 - 1,
      Math.random()*1.6 + 0.15,
      Math.random()*2 - 1
    ).normalize();
    particles.push({
      mesh: m,
      vel: dir.multiplyScalar(speed * (0.55 + Math.random()*0.9)),
      life: 0.75, maxLife: 0.75
    });
    scene.add(m);
  }
}

function updateParticles(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0){
      scene.remove(p.mesh);
      particles.splice(i, 1);
      continue;
    }
    p.vel.y -= 16 * dt;
    p.mesh.position.x += p.vel.x * dt;
    p.mesh.position.y += p.vel.y * dt;
    p.mesh.position.z += p.vel.z * dt;
    const s = Math.max(0.01, p.life / p.maxLife);
    p.mesh.scale.setScalar(s);
  }
}

/* ============================================================
   AUDIO (Web Audio, tiny & cheerful)
   ============================================================ */
let actx = null;
function ensureAudio(){
  if (!actx){
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(freq, dur, type, vol, slideTo){
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfxCollect(){
  tone(880, 0.09, 'triangle', 0.16);
  setTimeout(function(){ tone(1320, 0.11, 'triangle', 0.13); }, 70);
}
function sfxHeart(){
  tone(660, 0.1, 'sine', 0.16);
  setTimeout(function(){ tone(990, 0.1, 'sine', 0.15); }, 90);
  setTimeout(function(){ tone(1320, 0.16, 'sine', 0.13); }, 180);
}
function sfxHit(){
  tone(180, 0.28, 'sawtooth', 0.18, 60);
  tone(90, 0.32, 'square', 0.10, 45);
}
function sfxLevelUp(){
  [523, 659, 784, 1047].forEach(function(f, i){
    setTimeout(function(){ tone(f, 0.18, 'triangle', 0.15); }, i * 95);
  });
}
function sfxGameOver(){
  [440, 370, 294, 220].forEach(function(f, i){
    setTimeout(function(){ tone(f, 0.32, 'sine', 0.17); }, i * 160);
  });
}

/* ============================================================
   GAME STATE
   ============================================================ */
let state = 'start';          // start | playing | levelup | gameover
let level = 1;
let score = 0;
let lives = 3;
let collected = 0;
let goal = 6;
let fallSpeed = 4.2;
let spawnInterval = 1.1;
let bombChance = 0.15;

let spawnTimer = 0;
let levelTimer = 0;
let invuln = 0;
let time = 0;
let targetX = 0;
let pointerActive = false;
let prevPlayerX = 0;

const objects = [];
const FIELD_LIMIT = 5.2;
const MAX_LIVES = 5;

function applyLevel(l){
  goal          = 4 + l * 2;
  fallSpeed     = 3.4 + l * 0.78;
  spawnInterval = Math.max(0.40, 1.16 - l * 0.078);
  bombChance    = Math.min(0.42, 0.10 + l * 0.05);
}

/* ============================================================
   UI REFERENCES
   ============================================================ */
const overlay    = document.getElementById('overlay');
const banner     = document.getElementById('banner');
const bannerT    = banner.querySelector('.banner-title');
const bannerS    = banner.querySelector('.banner-sub');
const levelChip  = document.getElementById('levelChip');
const barFill    = document.getElementById('barFill');
const barText    = document.getElementById('barText');
const scoreEl    = document.getElementById('scoreEl');
const livesEl    = document.getElementById('livesEl');
const flashEl    = document.getElementById('flash');

function updateHUD(){
  levelChip.textContent = 'LEVEL ' + level;
  const pct = Math.min(100, (collected / goal) * 100);
  barFill.style.width = pct + '%';
  barText.textContent = collected + ' / ' + goal + ' ⭐';
  scoreEl.textContent = score;
  livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '💔';
}

function showBanner(title, sub){
  bannerT.textContent = title;
  bannerS.textContent = sub || '';
  banner.classList.remove('show');
  void banner.offsetWidth;
  banner.classList.add('show');
}
function hideBanner(){ banner.classList.remove('show'); }

function showOverlay(html){
  overlay.innerHTML = '<div class="card">' + html + '</div>';
  overlay.classList.add('show');
}
function hideOverlay(){
  overlay.classList.remove('show');
}

/* ============================================================
   OBJECT SPAWNING
   ============================================================ */
function spawnObject(){
  const r = Math.random();
  let type = 'star';
  if (r < bombChance) type = 'bomb';
  else if (r < bombChance + 0.05) type = 'heart';

  let mesh, targetScale = 1;
  if (type === 'bomb'){
    mesh = new THREE.Mesh(bombGeo, bombMat);
    targetScale = 1;
  } else if (type === 'heart'){
    mesh = new THREE.Mesh(heartGeo, heartMat);
    targetScale = 1;
  } else {
    mesh = new THREE.Mesh(starGeo, starMat);
    targetScale = 1;
  }

  const x = (Math.random() * 2 - 1) * 4.6;
  mesh.position.set(x, 8.5, 0);
  mesh.castShadow = true;
  mesh.scale.setScalar(0.01);
  scene.add(mesh);

  objects.push({
    mesh: mesh,
    type: type,
    speed: fallSpeed * (0.85 + Math.random() * 0.3),
    spin: (Math.random() * 2 - 1) * 3.4,
    age: 0,
    targetScale: targetScale
  });
}

function clearObjects(poof){
  for (let i = objects.length - 1; i >= 0; i--){
    const o = objects[i];
    if (poof && o.mesh.position.y < 9){
      spawnBurst(o.mesh.position, o.type === 'bomb' ? ['red','white'] : ['gold','white'], 6, 5);
    }
    scene.remove(o.mesh);
  }
  objects.length = 0;
}

/* ============================================================
   GAME FLOW
   ============================================================ */
function resetGame(){
  clearObjects(false);
  for (let i = particles.length - 1; i >= 0; i--) scene.remove(particles[i].mesh);
  particles.length = 0;

  level = 1; score = 0; lives = 3; collected = 0;
  applyLevel(level);

  targetX = 0;
  player.position.x = 0;
  prevPlayerX = 0;
  invuln = 0;
  spawnTimer = 0.9;
  updateHUD();
}

function startGame(){
  ensureAudio();
  resetGame();
  hideOverlay();
  hideBanner();
  state = 'playing';
}

function levelComplete(){
  state = 'levelup';
  score += 100;
  clearObjects(true);
  level++;
  applyLevel(level);
  collected = 0;
  updateHUD();
  showBanner('LEVEL ' + level, 'Get ready — it\'s faster now!');
  sfxLevelUp();
  levelTimer = 1.9;
}

function gameOver(){
  state = 'gameover';
  clearObjects(true);
  hideBanner();
  sfxGameOver();
  showOverlay(
    '<h1>GAME OVER</h1>' +
    '<p>You reached <b>Level ' + level + '</b></p>' +
    '<div class="final-score">' + score + '</div>' +
    '<p>points</p>' +
    '<button id="playBtn">PLAY AGAIN</button>'
  );
}

/* ============================================================
   COLLISION / PICKUP
   ============================================================ */
function handlePickup(o){
  if (o.type === 'star'){
    collected++;
    score += 10 * level;
    spawnBurst(o.mesh.position, ['gold','white'], 12, 7);
    sfxCollect();
    updateHUD();
    if (collected >= goal){
      levelComplete();
      return;
    }
  } else if (o.type === 'heart'){
    lives = Math.min(MAX_LIVES, lives + 1);
    spawnBurst(o.mesh.position, ['pink','white'], 14, 7);
    sfxHeart();
    updateHUD();
  } else { // bomb
    if (invuln > 0) return;
    lives--;
    invuln = 1.4;
    spawnBurst(o.mesh.position, ['red','white'], 18, 9);
    sfxHit();
    flashEl.classList.add('on');
    setTimeout(function(){ flashEl.classList.remove('on'); }, 70);
    updateHUD();
    if (lives <= 0){
      gameOver();
    }
  }
}

/* ============================================================
   UPDATE: PLAYING
   ============================================================ */
function updatePlaying(dt){
  // ---- Input ----
  let dir = 0;
  if (keys.left)  dir -= 1;
  if (keys.right) dir += 1;
  if (dir !== 0) targetX += dir * 11.5 * dt;
  targetX = Math.max(-FIELD_LIMIT, Math.min(FIELD_LIMIT, targetX));

  // ---- Smooth movement ----
  const k = 1 - Math.exp(-17 * dt);
  player.position.x += (targetX - player.position.x) * k;

  // ---- Invulnerability ----
  if (invuln > 0) invuln -= dt;

  // ---- Spawning ----
  spawnTimer -= dt;
  if (spawnTimer <= 0){
    spawnTimer = spawnInterval * (0.78 + Math.random() * 0.44);
    spawnObject();
  }

  // ---- Objects ----
  for (let i = objects.length - 1; i >= 0; i--){
    const o = objects[i];
    o.age += dt;

    // pop-in scale
    const t = Math.min(1, o.age / 0.18);
    const sc = o.targetScale * (0.3 + 0.7 * (1 - Math.pow(1 - t, 3)));
    o.mesh.scale.setScalar(sc);

    o.mesh.position.y -= o.speed * dt;
    o.mesh.rotation.y += o.spin * dt;
    o.mesh.rotation.x += o.spin * 0.45 * dt;

    const y = o.mesh.position.y;
    const dx = Math.abs(o.mesh.position.x - player.position.x);

    // collision with player
    if (y < 1.75 && y > -0.15 && dx < 0.95){
      scene.remove(o.mesh);
      objects.splice(i, 1);
      handlePickup(o);
      if (state !== 'playing') return;
      continue;
    }

    // fell off screen
    if (y < -3){
      scene.remove(o.mesh);
      objects.splice(i, 1);
    }
  }
}

/* ============================================================
   PLAYER VISUALS
   ============================================================ */
function updatePlayerVisual(dt){
  const vx = (player.position.x - prevPlayerX) / Math.max(dt, 0.0001);
  prevPlayerX = player.position.x;

  const targetLean = Math.max(-0.35, Math.min(0.35, -vx * 0.022));
  playerBody.rotation.z += (targetLean - playerBody.rotation.z) * Math.min(1, dt * 12);

  const targetTurn = Math.max(-0.4, Math.min(0.4, vx * 0.02));
  playerBody.rotation.y += (targetTurn - playerBody.rotation.y) * Math.min(1, dt * 10);

  // bobbing
  playerBody.position.y = Math.sin(time * 6.5) * 0.07;

  // invulnerability blink
  if (invuln > 0 && state === 'playing'){
    playerBody.visible = (Math.floor(time * 18) % 2 === 0);
  } else {
    playerBody.visible = true;
  }
}

/* ============================================================
   CAMERA
   ============================================================ */
function fitCamera(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  renderer.setSize(w, h, false);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  camera.aspect = w / h;

  const vFov = camera.fov * Math.PI / 180;
  const neededWidth = 14.5;
  let dist = (neededWidth / 2) / (Math.tan(vFov / 2) * camera.aspect);
  dist = Math.max(10.5, Math.min(dist, 23));

  camBaseZ = dist;
  camBaseY = Math.max(6.2, dist * 0.56);

  camera.position.set(0, camBaseY, camBaseZ);
  camera.lookAt(0, 1.7, 0);
  camera.updateProjectionMatrix();
}

function updateCamera(){
  const px = player.position.x;
  camera.position.x += (px * 0.20 - camera.position.x) * 0.09;
  camera.position.y = camBaseY;
  camera.position.z = camBaseZ;
  camera.lookAt(px * 0.13, 1.7, 0);
}

/* ============================================================
   ENVIRONMENT ANIMATION
   ============================================================ */
function updateEnvironment(dt){
  for (let i=0;i<clouds.length;i++){
    const c = clouds[i];
    c.mesh.position.x += c.speed * dt;
    if (c.mesh.position.x > 48) c.mesh.position.x = -48;
  }
}

/* ============================================================
   INPUT
   ============================================================ */
const keys = { left:false, right:false };

window.addEventListener('keydown', function(e){
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;

  if (k === ' ' || k === 'Enter'){
    ensureAudio();
    if (state === 'start' || state === 'gameover'){
      startGame();
      e.preventDefault();
    }
  }
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === 'ArrowDown' || k === ' '){
    e.preventDefault();
  }
}, { passive:false });

window.addEventListener('keyup', function(e){
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
});

// ----- Pointer / touch control -----
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const playPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const tmpVec = new THREE.Vector3();

function pointerToWorldX(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  ndc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.ray.intersectPlane(playPlane, tmpVec);
  if (!hit) return null;
  return Math.max(-FIELD_LIMIT, Math.min(FIELD_LIMIT, tmpVec.x));
}

function onPointerMove(e){
  if (state !== 'playing') return;
  if (e.pointerType === 'mouse' || pointerActive){
    const wx = pointerToWorldX(e.clientX, e.clientY);
    if (wx !== null) targetX = wx;
  }
}

window.addEventListener('pointerdown', function(e){
  ensureAudio();
  if (state !== 'playing') return;
  pointerActive = true;
  const wx = pointerToWorldX(e.clientX, e.clientY);
  if (wx !== null) targetX = wx;
}, { passive:true });

window.addEventListener('pointermove', onPointerMove, { passive:true });

window.addEventListener('pointerup', function(){ pointerActive = false; }, { passive:true });
window.addEventListener('pointercancel', function(){ pointerActive = false; }, { passive:true });

// Overlay button handling
overlay.addEventListener('click', function(e){
  const t = e.target;
  if (t && t.id === 'playBtn'){
    startGame();
  }
});

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  time += dt;

  updateEnvironment(dt);

  if (state === 'playing'){
    updatePlaying(dt);
  } else if (state === 'levelup'){
    levelTimer -= dt;
    if (levelTimer <= 0){
      state = 'playing';
      hideBanner();
      spawnTimer = 0.7;
    }
  }

  updateParticles(dt);
  updatePlayerVisual(dt);
  updateCamera();

  renderer.render(scene, camera);
}

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('resize', fitCamera);
window.addEventListener('orientationchange', function(){ setTimeout(fitCamera, 120); });

fitCamera();
updateHUD();

showOverlay(
  '<h1>⭐ STAR CATCHER ⭐</h1>' +
  '<p>Catch the falling <b>stars</b>!</p>' +
  '<p class="warn">Dodge the spiky purple bombs!</p>' +
  '<div class="hints">' +
    '<div class="hint">← → or A / D</div>' +
    '<div class="hint">or drag / move mouse</div>' +
  '</div>' +
  '<button id="playBtn">PLAY</button>'
);

animate();

})();
</script>
